name = "sbl-tools-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "sbltool.creationtech.info", custom_domain = true }
]

[observability]
enabled = true

# Host React + Vite Frontend UI directly on Cloudflare Workers
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 Database Binding (Source of Truth via Drizzle ORM)
[[d1_databases]]
binding = "DB"
database_name = "sbl-database"
database_id = "99e1fe4e-6100-477c-87e9-d21c15f0cf82"
migrations_dir = "drizzle"

# Cloudflare R2 Bucket for File and Image Storage
[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "sbl-tools-storage"

[vars]
JWT_SECRET = "super-secret-jwt-key-replace-in-production"
