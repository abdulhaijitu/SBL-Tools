name = "sbl-tools-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Cloudflare D1 Database Binding (Source of Truth via Drizzle ORM)
[[d1_databases]]
binding = "DB"
database_name = "sbl-database"
database_id = "1847da70-be02-4231-ad85-890ead8ee63e"
migrations_dir = "drizzle"

# Cloudflare R2 Bucket for File and Image Storage
[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "sbl-tools-storage"

[vars]
JWT_SECRET = "super-secret-jwt-key-replace-in-production"
