name = "sbl-tools-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Cloudflare Hyperdrive connection pooling for PostgreSQL
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "YOUR_HYPERDRIVE_CONFIG_ID"
localConnectionString = "postgresql://postgres:postgres@localhost:5432/sbl_tools"

# Cloudflare R2 Bucket for File and Photo Storage (Rule 9)
[[r2_buckets]]
binding = "R2_STORAGE"
bucket_name = "sbl-tools-storage"

[vars]
JWT_SECRET = "super-secret-jwt-key-replace-in-production"
