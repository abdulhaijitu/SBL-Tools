<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অফলাইন · SBL Tools</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#f97316">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #090d16;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .offline-card {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(249, 115, 22, 0.12);
            color: #f97316;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 36px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .retry-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            background: #f97316;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .retry-btn:hover {
            background: #ea580c;
            transform: translateY(-1px);
        }
        .retry-btn:active {
            transform: translateY(0);
        }
        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-circle">📡</div>
        <h1>ইন্টারনেট সংযোগ নেই</h1>
        <p>আপনার ডিভাইসটি বর্তমানে অফলাইনে আছে। অনুগ্রহ করে আপনার ইন্টারনেট কানেকশন বা ওয়াইফাই চেক করে আবার চেষ্টা করুন।</p>
        <button class="retry-btn" onclick="window.location.reload()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 2v6h-6"></path>
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                <path d="M3 22v-6h6"></path>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            </svg>
            পুনরায় চেষ্টা করুন
        </button>
        <div class="badge">SBL Tools Offline Safe Mode</div>
    </div>
</body>
</html>
